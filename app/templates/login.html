{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<form class="login" method="post" aria-label="Entrar no painel">
  <h1>Painel da Rede GPON</h1>
  <p class="sub">Gerência de TI · Prefeitura de Anápolis</p>
  <label>Usuário <input name="login" autocomplete="username" required autofocus></label>
  <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
  {% if erro %}<div class="erro" role="alert">{{ erro }}</div>{% endif %}
  <button>Entrar</button>
</form>
{% endblock %}
